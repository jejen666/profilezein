  <nav class="navbar">

    <ul class="nav-links">

    <a href="kontak.html" class="btn-primary">HUBUNGI SAYA</a>
  </nav>

  <div class="page-header">
    <h1>Kontak Saya</h1>
  </div>

  <main class="page-wrap">
    <div class="contact-grid">

      <div class="contact-list">

        <div class="detail-item">
          <div class="detail-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" fill="#2f7ef7"/><path d="M3 6l9 7 9-7" stroke="white" stroke-width="1.4"/></svg>
          </div>
          <div>
            <h4>Email</h4>
            <p>aqeel.zein@example.com</p>
          </div>
        </div>

        <div class="detail-item">
          <div class="detail-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.3c1.4.8 3.1 1.3 4.8 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2z" fill="#2f7ef7"/></svg>
          </div>
          <div>
            <h4>WhatsApp</h4>
            <p>0812-3456-7890</p>
          </div>
        </div>

        <div class="detail-item">
          <div class="detail-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" fill="#2f7ef7"/><circle cx="12" cy="12" r="4.2" fill="white"/><circle cx="17.2" cy="6.8" r="1.1" fill="white"/></svg>
          </div>
          <div>
            <h4>Instagram</h4>
            <p>@aqeelzein_</p>
          </div>
        </div>

        <div class="detail-item">
          <div class="detail-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z" fill="#2f7ef7"/><circle cx="12" cy="10" r="2.6" fill="white"/></svg>
          </div>
          <div>
            <h4>Lokasi</h4>
            <p>Yogyakarta, Indonesia</p>
          </div>
        </div>

      </div>

      <div class="contact-form">
        <h3>Kirim Pesan</h3>
        <form onsubmit="event.preventDefault(); alert('Pesan terkirim! (contoh tampilan, belum terhubung ke server)');">
          <div class="form-group">
            <label for="nama">Nama</label>
            <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Masukkan email Anda" required>
          </div>
          <div class="form-group">
            <label for="pesan">Pesan</label>
            <textarea id="pesan" placeholder="Tulis pesan Anda di sini..." required></textarea>
          </div>
          <button type="submit" class="btn-submit">KIRIM PESAN ➤</button>
        </form>
      </div>

    </div>
  </main>

  <footer>
    <p>© 2026 Aqeel Zein. All Rights Reserved.</p>
    <div class="footer-socials">
      <a href="#" aria-label="Instagram">IG</a>
      <a href="#" aria-label="GitHub">GH</a>
      <a href="#" aria-label="LinkedIn">IN</a>
    </div>
  </footer>

</body>
